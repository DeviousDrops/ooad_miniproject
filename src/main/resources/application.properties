spring.application.name=pharmacy-inventory-billing

spring.datasource.url=jdbc:h2:file:./data/pharmacydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Flyway owns the schema; Hibernate only verifies the entity mappings still match it.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

pharmacy.tax-percent=5
