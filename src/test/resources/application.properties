spring.application.name=pharmacy-inventory-billing

# Tests run against a throwaway in-memory database so they never mutate ./data/pharmacydb
# and cannot leak rows between runs.
spring.datasource.url=jdbc:h2:mem:pharmacydb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

pharmacy.tax-percent=5
